name: Validate marketplace index

on:
  pull_request:
    paths:
      - "index.json"
      - "site/index.json"
      - "modules/**"
      - "releases/**"
      - "scripts/validate-marketplace-index.mjs"
      - ".github/workflows/validate-marketplace.yml"
  push:
    branches: [ main ]
    paths:
      - "index.json"
      - "site/index.json"
      - "modules/**"
      - "releases/**"
      - "scripts/validate-marketplace-index.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate index and releases
        run: node scripts/validate-marketplace-index.mjs
