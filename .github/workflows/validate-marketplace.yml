name: Validate marketplace index

on:
  pull_request:
    paths:
      - "index.json"
      - "site/index.json"
      - "modules/**"
      - "releases/**"
      - "keys.json"
      - "scripts/manage-keys.mjs"
      - "scripts/lib/trusted-keys.mjs"
      - "scripts/validate-marketplace-index.mjs"
      - ".github/workflows/validate-marketplace.yml"
  push:
    branches: [ main ]
    paths:
      - "index.json"
      - "site/index.json"
      - "modules/**"
      - "releases/**"
      - "keys.json"
      - "scripts/manage-keys.mjs"
      - "scripts/lib/trusted-keys.mjs"
      - "scripts/validate-marketplace-index.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Validate author keys
        run: node scripts/manage-keys.mjs validate

      - name: Trusted key tests
        run: node scripts/test-trusted-keys.mjs

      - name: Fork PRs may only submit experimental
        if: github.event_name == 'pull_request'
        env:
          HEAD_REPO_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: node scripts/check-submission-status.mjs

      - name: Validate index and releases
        run: node scripts/validate-marketplace-index.mjs
