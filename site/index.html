<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>功能模組市集｜數位校園工具箱</title>
    <style>
      :root {
        --bg: #efeff4;
        --panel: #f8f8fb;
        --surface: #ffffff;
        --line: #dfe3ec;
        --text: #1d2736;
        --muted: #6d7788;
        --primary: #2a6ee3;
        --primary-soft: #edf3ff;
        --success-bg: #eaf7ee;
        --success-text: #1d8a5d;
        --shadow: 0 12px 30px rgba(18, 30, 52, 0.06);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", "Microsoft JhengHei", ui-sans-serif, sans-serif;
      }

      a { color: inherit; }

      .page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 0 80px;
      }

      .topbar {
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        background: rgba(255,255,255,0.78);
        border-bottom: 1px solid rgba(141, 151, 170, 0.3);
        backdrop-filter: blur(8px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
      }

      .brand-mark {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: linear-gradient(135deg, #ffb347, #f97316);
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 0.82rem;
        font-weight: 800;
      }

      .brand-name {
        font-size: 1.08rem;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 34px;
        padding: 0 14px;
        border-radius: 999px;
        background: #edf3ff;
        color: var(--primary);
        border: 1px solid rgba(42, 110, 227, 0.18);
        font-size: 0.82rem;
        font-weight: 700;
      }

      a.pill { text-decoration: none; }
      a.pill:hover { background: #dfe9ff; }

      .topbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

      .site-footer {
        margin-top: 40px;
        padding: 18px 4px 0;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.82rem;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        justify-content: space-between;
      }

      .site-footer a { color: var(--primary); text-decoration: none; font-weight: 700; }

      .container {
        width: min(1200px, calc(100% - 40px));
        margin: 0 auto;
      }

      .hero {
        margin-top: 32px;
        padding: 28px 30px 18px;
        background: rgba(255,255,255,0.5);
        border: 1px solid rgba(135, 147, 167, 0.24);
        border-radius: 20px;
        box-shadow: var(--shadow);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 4vw, 3.2rem);
        line-height: 1.2;
        letter-spacing: -0.06em;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--primary);
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .subtitle {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }

      .stat {
        min-width: 160px;
        flex: 1 1 160px;
        padding: 14px 16px 12px;
        background: rgba(255,255,255,0.35);
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .stat strong {
        display: block;
        font-size: 1.1rem;
        margin-bottom: 2px;
      }

      .stat span {
        display: inline-block;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .badge-live {
        display: inline-block;
        margin-top: 4px;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 700;
        background: #eaf7ee;
        color: var(--success-text);
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin: 18px 0 20px;
        padding: 10px 12px;
        background: rgba(255,255,255,0.35);
        border: 1px solid var(--line);
        border-radius: 14px;
      }

      .search {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 220px;
      }

      .search input {
        width: 100%;
        border: none;
        background: transparent;
        color: var(--text);
        font-size: 0.95rem;
        outline: none;
      }

      .search input::placeholder {
        color: var(--muted);
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-left: 8px;
      }

      .filter-btn {
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        border-radius: 10px;
        height: 36px;
        padding: 0 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .filter-btn.active {
        background: var(--primary-soft);
        color: var(--primary);
        border-color: rgba(42, 110, 227, 0.18);
      }

      .card-list {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .module-card {
        background: rgba(255,255,255,0.55);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px 18px 15px;
        box-shadow: var(--shadow);
      }

      .module-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .module-icon {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-weight: 700;
        background: linear-gradient(135deg, #cdf0ff, #dfe9ff);
        color: #2f5fe1;
      }

      .module-version {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--success-bg);
        color: var(--success-text);
        font-size: 0.72rem;
        font-weight: 700;
      }

      .module-title {
        font-size: clamp(1.3rem, 2vw, 2rem);
        margin: 0;
        line-height: 1.3;
        letter-spacing: -0.04em;
      }

      .meta-row {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .meta-row span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .description {
        margin: 16px 0 14px;
        color: #2d3748;
        line-height: 1.7;
        font-size: 1rem;
        white-space: pre-line;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }

      .tag {
        background: #f3f5f9;
        border: 1px solid #e2e7ef;
        color: #536178;
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .btn {
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 126px;
        height: 44px;
        padding: 0 18px;
        border-radius: 12px;
        border: 1px solid transparent;
        font-weight: 700;
        cursor: pointer;
      }

      .btn.primary {
        background: var(--primary);
        color: #fff;
        box-shadow: 0 10px 20px rgba(42, 110, 227, 0.20);
      }

      .btn.secondary {
        background: #fff;
        color: var(--text);
        border-color: var(--line);
      }

      .status-box,
      .empty {
        margin-top: 18px;
        background: rgba(255,255,255,0.55);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px 20px;
        color: var(--muted);
      }

      @media (max-width: 700px) {
        .toolbar {
          flex-direction: column;
          align-items: stretch;
        }

        .filters {
          margin-left: 0;
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark">模</div>
          <div class="brand-name">功能模組市集</div>
        </div>
        <div class="topbar-actions">
          <a class="pill" href="./docs.html">開發者文件</a>
          <div class="pill">數位校園工具箱</div>
        </div>
      </div>

      <div class="container">
        <section class="hero">
          <p class="eyebrow">數位校園工具箱</p>
          <h1>功能模組市集</h1>
          <p class="subtitle">擴充校園系統能力，讓管理與教務更輕鬆</p>

          <div class="stats">
            <div class="stat">
              <strong id="module-count">0</strong>
              <span>模組數</span>
            </div>
            <div class="stat">
              <strong id="host-version">0.396</strong>
              <span>最低版本</span>
            </div>
            <div class="stat">
              <strong><span class="badge-live" id="catalog-state">正常</span></strong>
              <span>市集狀態</span>
            </div>
          </div>
        </section>

        <div class="toolbar">
          <div class="search">
            <span>🔎</span>
            <input id="searchInput" type="text" placeholder="搜尋模組、標籤或描述" aria-label="搜尋模組" />
          </div>

          <div class="filters">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="academics">學務/教務</button>
            <button class="filter-btn" data-filter="admin">管理</button>
          </div>
        </div>

        <div id="app"></div>

        <footer class="site-footer">
          <span>© 功能模組市集 · 數位校園工具箱</span>
          <span>
            <a href="./docs.html">開發者文件</a>
            ·
            <a href="https://github.com/takan003/campus-toolkit" target="_blank" rel="noreferrer">宿主主程式</a>
            ·
            <a href="https://github.com/takan003/campus-toolkit-marketplace" target="_blank" rel="noreferrer">市集 repo</a>
          </span>
        </footer>
      </div>
    </div>

    <script>
      const MARKET_INDEX_URL = './index.json?ts=' + Date.now();
      let moduleData = [];

      const CATEGORY_LABELS = {
        academics: '學務/教務',
        admin: '管理',
        general: '一般',
      };

      const TAG_LABELS = {
        exam: '考試',
        registration: '報名',
        student: '學生',
      };

      const MODULE_DISPLAY = {
        examRegistration: {
          name: '升學考試與模擬考校內報名',
          description: '協助學生完成升學考試與模擬考校內報名流程，含報名資訊、時間表與狀態管理。',
        },
      };

      function toDisplayCategory(category) {
        return CATEGORY_LABELS[category] || '一般';
      }

      function toDisplayTags(tags) {
        return (tags || []).slice(0, 3).map((tag) => TAG_LABELS[tag] || tag);
      }

      function toDisplayModuleName(module) {
        const id = module?.id || '';
        if (MODULE_DISPLAY[id]) return MODULE_DISPLAY[id].name;
        return module?.name || '模組';
      }

      function toDisplayModuleDescription(module) {
        const id = module?.id || '';
        if (MODULE_DISPLAY[id]) return MODULE_DISPLAY[id].description;
        return module?.description || '暫無模組說明。';
      }

      async function loadModules() {
        const app = document.getElementById('app');
        app.innerHTML = '<div class="status-box">載入模組市集中…</div>';

        try {
          const response = await fetch(MARKET_INDEX_URL, { cache: 'no-store' });
          if (!response.ok) throw new Error('Failed to load marketplace index');
          const data = await response.json();
          moduleData = Array.isArray(data.modules) ? data.modules : [];
          renderModules();
          document.getElementById('module-count').textContent = String(moduleData.length);
          document.getElementById('catalog-state').textContent = '正常';
        } catch (error) {
          document.getElementById('catalog-state').textContent = '離線';
          app.innerHTML = '<div class="empty">模組市集目前暫時無法載入。</div>';
        }
      }

      function renderModules() {
        const app = document.getElementById('app');
        const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
        const activeFilter = document.querySelector('.filter-btn.active')?.dataset.filter || 'all';

        const filtered = moduleData.filter((module) => {
          const category = (module.category || '').toLowerCase();
          const inCategory = activeFilter === 'all' || category === activeFilter;
          const searchable = [module.name, module.description, module.id, ...(module.tags || [])].join(' ').toLowerCase();
          const inSearch = !searchTerm || searchable.includes(searchTerm);
          return inCategory && inSearch;
        });

        if (!filtered.length) {
          app.innerHTML = '<div class="empty">沒有符合條件的模組。</div>';
          return;
        }

        app.innerHTML = `<div class="card-list">${filtered.map((module) => {
          const tags = toDisplayTags(module.tags).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('');
          const repoLink = module.repoUrl ? `<a class="btn secondary" href="${escapeHtml(module.repoUrl)}" target="_blank" rel="noreferrer">查看原始碼</a>` : '';
          const downloadLink = module.downloadUrl ? `<a class="btn primary" href="${escapeHtml(module.downloadUrl)}" target="_blank" rel="noreferrer">立即安裝</a>` : '';
          const category = module.category ? escapeHtml(toDisplayCategory(module.category.toLowerCase())) : '一般';
          const hostVersion = module.minHostVersion ? escapeHtml(module.minHostVersion) : '任意';

          const displayName = toDisplayModuleName(module);
          const displayDescription = toDisplayModuleDescription(module);

          return `
            <article class="module-card">
              <div class="module-head">
                <div class="module-icon">${escapeHtml((displayName || module.id || 'M').slice(0,1).toUpperCase())}</div>
                <div class="module-version">版本 ${escapeHtml(module.version || '0.0.0')}</div>
              </div>

              <h2 class="module-title">${escapeHtml(displayName)}</h2>

              <div class="meta-row">
                <span>📦 ${category}</span>
                <span>🧩 需求版本 ${hostVersion}</span>
              </div>

              <p class="description">${escapeHtml(displayDescription)}</p>

              <div class="tags">${tags}</div>

              <div class="actions">
                ${downloadLink}
                ${repoLink}
              </div>
            </article>
          `;
        }).join('')}</div>`;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      document.getElementById('searchInput').addEventListener('input', renderModules);
      document.querySelectorAll('.filter-btn').forEach((button) => {
        button.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');
          renderModules();
        });
      });

      loadModules();
    </script>
  </body>
</html>
