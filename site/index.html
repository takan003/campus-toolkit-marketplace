<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>campus-toolkit marketplace</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --line: #dfe7f3;
        --text: #1e293b;
        --muted: #64748b;
        --primary: #2563eb;
        --primary-soft: #eaf2ff;
        --primary-strong: #1d4ed8;
        --success: #0f766e;
        --warning: #b45309;
        --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: linear-gradient(180deg, #eef3ff 0%, var(--bg) 120px, var(--bg) 100%);
        color: var(--text);
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }

      a { color: inherit; }

      .page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 72px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 26px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: linear-gradient(135deg, #ffb703, #f97316);
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 0.82rem;
        font-weight: 800;
        box-shadow: 0 8px 20px rgba(249, 115, 22, 0.25);
      }

      .brand-name {
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.08);
        color: var(--primary);
        border: 1px solid rgba(37, 99, 235, 0.18);
        font-size: 0.8rem;
        font-weight: 700;
      }

      .hero {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 26px 24px;
        margin-bottom: 22px;
      }

      .hero-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.1rem, 3vw, 3.2rem);
        letter-spacing: -0.05em;
      }

      .subtitle {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 18px;
      }

      .stat {
        padding: 10px 12px;
        border-radius: 12px;
        background: #f8faff;
        border: 1px solid var(--line);
        min-width: 125px;
      }

      .stat strong {
        display: block;
        font-size: 1.25rem;
      }

      .stat span {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 14px;
        margin: 20px 0 24px;
      }

      .search {
        flex: 1;
        min-width: 240px;
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255,255,255,0.8);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .search input {
        flex: 1;
        border: none;
        background: transparent;
        font-size: 0.98rem;
        color: var(--text);
        outline: none;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .filter-btn {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--muted);
        padding: 10px 12px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
      }

      .filter-btn.active {
        background: var(--primary-soft);
        color: var(--primary-strong);
        border-color: rgba(37, 99, 235, 0.2);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
      }

      .card {
        background: rgba(255,255,255,0.9);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px 18px 16px;
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.04);
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }

      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
      }

      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 15px;
      }

      .icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-weight: 800;
        background: linear-gradient(135deg, rgba(37,99,235,0.1), rgba(59,130,246,0.25));
        color: var(--primary-strong);
      }

      .version {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 68px;
        padding: 6px 9px;
        background: #eef7ee;
        color: var(--success);
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .card h3 {
        margin: 0;
        font-size: 1.18rem;
        letter-spacing: -0.02em;
      }

      .meta {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.8rem;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .meta span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .description {
        margin: 14px 0 16px;
        color: var(--text);
        line-height: 1.6;
        min-height: 68px;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }

      .tag {
        background: #f1f5f9;
        color: #475569;
        border: 1px solid #e2e8f0;
        border-radius: 999px;
        padding: 6px 9px;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .btn.primary {
        background: var(--primary);
        color: #fff;
        box-shadow: 0 8px 18px rgba(37,99,235,0.22);
      }

      .btn.secondary {
        background: #fff;
        border-color: var(--line);
        color: var(--text);
      }

      .status-box {
        margin-top: 18px;
        padding: 12px 14px;
        background: #f8fafc;
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--muted);
      }

      .empty {
        background: rgba(255,255,255,0.8);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
        color: var(--muted);
        box-shadow: var(--shadow);
      }

      @media (max-width: 640px) {
        .topbar, .hero-top, .toolbar {
          align-items: flex-start;
        }

        .hero {
          padding: 20px 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark">C</div>
          <div class="brand-name">campus-toolkit</div>
        </div>
        <div class="pill">marketplace</div>
      </div>

      <section class="hero">
        <div class="hero-top">
          <div>
            <h1>campus-toolkit marketplace</h1>
            <p class="subtitle">Independent module catalog for the host app</p>
          </div>
        </div>

        <div class="stats">
          <div class="stat"><strong id="module-count">0</strong><span>modules</span></div>
          <div class="stat"><strong id="host-version">0.396</strong><span>min host</span></div>
          <div class="stat"><strong id="catalog-state">live</strong><span>catalog status</span></div>
        </div>
      </section>

      <div class="toolbar">
        <div class="search">
          <span>🔎</span>
          <input id="searchInput" type="text" placeholder="Search modules and tags" aria-label="Search modules" />
        </div>

        <div class="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="academics">Academics</button>
          <button class="filter-btn" data-filter="admin">Admin</button>
        </div>
      </div>

      <div id="app"></div>
    </div>

    <script>
      const MARKET_INDEX_URL = './index.json';
      let moduleData = [];

      async function loadModules() {
        const app = document.getElementById('app');
        app.innerHTML = '<div class="status-box">Loading module catalog…</div>';

        try {
          const response = await fetch(MARKET_INDEX_URL, { cache: 'no-store' });
          if (!response.ok) throw new Error('Failed to load marketplace index');
          const data = await response.json();
          moduleData = Array.isArray(data.modules) ? data.modules : [];
          renderModules();
          document.getElementById('module-count').textContent = String(moduleData.length);
          document.getElementById('catalog-state').textContent = 'live';
        } catch (error) {
          document.getElementById('catalog-state').textContent = 'offline';
          app.innerHTML = '<div class="empty">Marketplace index is unavailable right now.</div>';
        }
      }

      function renderModules() {
        const app = document.getElementById('app');
        const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
        const activeFilter = document.querySelector('.filter-btn.active')?.dataset.filter || 'all';

        const filtered = moduleData.filter((module) => {
          const inCategory = activeFilter === 'all' || (module.category || '').toLowerCase() === activeFilter;
          const searchable = [module.name, module.description, module.id, ...(module.tags || [])].join(' ').toLowerCase();
          const inSearch = !searchTerm || searchable.includes(searchTerm);
          return inCategory && inSearch;
        });

        if (!filtered.length) {
          app.innerHTML = '<div class="empty">No matching modules were found.</div>';
          return;
        }

        app.innerHTML = `<div class="grid">${filtered.map((module) => {
          const tags = (module.tags || []).slice(0, 3).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('');
          const repoLink = module.repoUrl ? `<a class="btn secondary" href="${escapeHtml(module.repoUrl)}" target="_blank" rel="noreferrer">Repository</a>` : '';
          const downloadLink = module.downloadUrl ? `<a class="btn primary" href="${escapeHtml(module.downloadUrl)}" target="_blank" rel="noreferrer">Download</a>` : '';
          const category = module.category ? escapeHtml(module.category) : 'general';
          const hostVersion = module.minHostVersion ? escapeHtml(module.minHostVersion) : 'any';

          return `
            <article class="card">
              <div class="card-head">
                <div class="icon">${escapeHtml((module.name || module.id || 'M').slice(0, 1).toUpperCase())}</div>
                <div class="version">v${escapeHtml(module.version || '0.0.0')}</div>
              </div>

              <h3>${escapeHtml(module.name || module.id || 'Module')}</h3>

              <div class="meta">
                <span>📦 ${category}</span>
                <span>🧩 ${hostVersion}</span>
              </div>

              <p class="description">${escapeHtml(module.description || 'No description provided.')}</p>

              <div class="tags">${tags}</div>

              <div class="actions">
                ${downloadLink}
                ${repoLink}
              </div>
            </article>
          `;
        }).join('')}</div>`;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      document.getElementById('searchInput').addEventListener('input', renderModules);
      document.querySelectorAll('.filter-btn').forEach((button) => {
        button.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');
          renderModules();
        });
      });

      loadModules();
    </script>
  </body>
</html>
