<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>campus-toolkit marketplace</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --line: #dfe6f1;
        --text: #1f2937;
        --muted: #667085;
        --primary: #2563eb;
        --primary-soft: #eaf1ff;
        --success: #0f766e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 48px 20px 80px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 28px;
      }
      .title {
        font-size: 2rem;
        font-weight: 700;
        margin: 0;
      }
      .badge {
        display: inline-block;
        background: var(--primary-soft);
        color: var(--primary);
        border: 1px solid #cfe0ff;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.8rem;
        font-weight: 700;
      }
      .sub {
        color: var(--muted);
        margin: 8px 0 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
      }
      .card h2 {
        margin: 0 0 10px;
        font-size: 1.25rem;
      }
      .meta {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 12px;
      }
      .description {
        color: var(--text);
        line-height: 1.6;
        margin: 0 0 16px;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }
      .tag {
        background: #eef2ff;
        color: #3847d9;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .btn {
        display: inline-block;
        text-decoration: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 700;
        border: 1px solid var(--line);
      }
      .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: white;
      }
      .btn.secondary {
        background: white;
        color: var(--text);
      }
      .status {
        color: var(--success);
        font-size: 0.78rem;
        font-weight: 700;
      }
      .empty {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div>
          <h1 class="title">campus-toolkit marketplace</h1>
          <p class="sub">Independent module catalog for the host app</p>
        </div>
        <span class="badge">marketplace</span>
      </div>
      <div id="app"></div>
    </div>
    <script>
      const MARKET_INDEX_URL = '../index.json';
      async function loadModules() {
        const app = document.getElementById('app');
        try {
          const response = await fetch(MARKET_INDEX_URL, { cache: 'no-store' });
          if (!response.ok) throw new Error('Failed to load marketplace index');
          const data = await response.json();
          const modules = Array.isArray(data.modules) ? data.modules : [];
          if (!modules.length) {
            app.innerHTML = '<div class="empty">No modules published yet.</div>';
            return;
          }
          const cards = modules.map((module) => {
            const tags = (module.tags || []).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('');
            const repoLink = module.repoUrl ? `<a class="btn secondary" href="${escapeHtml(module.repoUrl)}" target="_blank" rel="noreferrer">Repository</a>` : '';
            const downloadLink = module.downloadUrl ? `<a class="btn primary" href="${escapeHtml(module.downloadUrl)}" target="_blank" rel="noreferrer">Download</a>` : '';
            const minHost = module.minHostVersion ? `<div class="meta">Requires host: ${escapeHtml(module.minHostVersion)}</div>` : '';
            return `
              <article class="card">
                <div class="status">${escapeHtml(module.version || 'v0')}</div>
                <h2>${escapeHtml(module.name || module.id)}</h2>
                ${minHost}
                <p class="description">${escapeHtml(module.description || '')}</p>
                <div class="tags">${tags}</div>
                <div class="actions">
                  ${downloadLink}
                  ${repoLink}
                </div>
              </article>
            `;
          }).join('');
          app.innerHTML = `<div class="grid">${cards}</div>`;
        } catch (error) {
          app.innerHTML = '<div class="empty">Marketplace index is unavailable right now.</div>';
        }
      }
      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }
      loadModules();
    </script>
  </body>
</html>
